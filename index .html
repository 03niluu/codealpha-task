<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Car Image Gallery</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <div class="header-section">
                <p class="header-kicker">THE OPEN ROAD</p>
                <h1>Vehicle's <span>Canvas</span></h1>
                <p class="header-line">A collection of motion, form, and
                    freedom.</p>
            </div>
        </header>
        <main>
            <section class="image-section">
                <div class="filter-bar" aria-label="Vehicle type filters">
                    <button class="filter-button active" type="button" data-filter="all">All</button>
                    <button class="filter-button" type="button" data-filter="car">Cars</button>
                    <button class="filter-button" type="button" data-filter="bike">Bikes</button>
                    <button class="filter-button" type="button" data-filter="cycle">Cycles</button>
                </div>

                <ul class="image-list" aria-label="Vehicle image gallery">
                    <li data-type="car"><img src="images/cars/img1.jpg" alt="Car 1"></li>
                    <li data-type="car"><img src="images/cars/img2.jpg" alt="Car 2"></li>
                    <li data-type="car"><img src="images/cars/img3.jpg" alt="Car 3"></li>
                    <li data-type="car"><img src="images/cars/img4.jpg" alt="Car 4"></li>
                    <li data-type="car"><img src="images/cars/img5.jpg" alt="Car 5"></li>
                    <li data-type="car"><img src="images/cars/img6.jpg" alt="Car 6"></li>
                    <li data-type="car"><img src="images/cars/img7.jpg" alt="Car 7"></li>
                    <li data-type="car"><img src="images/cars/img8.jpg" alt="Car 8"></li>
                    <li data-type="car"><img src="images/cars/img9.jpg" alt="Car 9"></li>
                    <li data-type="car"><img src="images/cars/img10.jpg" alt="Car 10"></li>
                    <li data-type="car"><img src="images/cars/img11.jpg" alt="Car 11"></li>
                    <li data-type="car"><img src="images/cars/img12.jpg" alt="Car 12"></li>
                    <li data-type="car"><img src="images/cars/img13.jpg" alt="Car 13"></li>
                    <li data-type="car"><img src="images/cars/img14.jpg" alt="Car 14"></li>
                    <li data-type="car"><img src="images/cars/img15.jpg" alt="Car 15"></li>
                    <li data-type="car"><img src="images/cars/img16.jpg" alt="Car 16"></li>
                    <li data-type="car"><img src="images/cars/img17.jpg" alt="Car 17"></li>
                    <li data-type="car"><img src="images/cars/img18.jpg" alt="Car 18"></li>
                    <li data-type="bike"><img src="images/bikes/pht1.jpg" alt="Bike 1"></li>
                    <li data-type="bike"><img src="images/bikes/pht2.jpg" alt="Bike 2"></li>
                    <li data-type="bike"><img src="images/bikes/pht3.jpg" alt="Bike 3"></li>
                    <li data-type="bike"><img src="images/bikes/pht4.jpg" alt="Bike 4"></li>
                    <li data-type="bike"><img src="images/bikes/pht5.jpg" alt="Bike 5"></li>
                    <li data-type="bike"><img src="images/bikes/pht6.jpg" alt="Bike 6"></li>
                    <li data-type="bike"><img src="images/bikes/pht7.jpg" alt="Bike 7"></li>
                    <li data-type="bike"><img src="images/bikes/pht8.jpg" alt="Bike 8"></li>
                    <li data-type="cycle"><img src="images/cycles/cyc2.jpg" alt="Cycle 2"></li>
                    <li data-type="cycle"><img src="images/cycles/cyc3.jpg" alt="Cycle 3"></li>
                    <li data-type="cycle"><img src="images/cycles/cyc4.jpg" alt="Cycle 4"></li>
                    <li data-type="cycle"><img src="images/cycles/cyc5.jpg" alt="Cycle 5"></li>
                </ul>
            </section>
        </main>

        <dialog id="image-viewer" aria-label="Image viewer">
            <button id="viewer-close" class="viewer-button viewer-close"
                type="button" aria-label="Close image viewer">&times;</button>
            <button id="viewer-previous" class="viewer-button viewer-previous"
                type="button" aria-label="View previous image">&#10094;</button>
            <figure>
                <img id="viewer-image" src alt>
            </figure>
            <button id="viewer-next" class="viewer-button viewer-next"
                type="button" aria-label="View next image">&#10095;</button>
        </dialog>

        <script src="javascript/gallery.js"></script>
        <footer>
            <p class="footer-line">&copy; 2026 Vehicle's Canvas. All rights reserved.</p>
            </footer>   
    </body>
       
    </html>
